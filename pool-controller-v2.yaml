substitutions:
  device_name: pool-controller-v2
  friendly_name: Pool Controller V2

packages:
  common: !include .common.yaml

  dose_chlorine_script: !include
    file: pool-controller/dose-script.yaml
    vars:
      chemical: chlorine
      pump_id: chlorinator

  dose_acid_script: !include
    file: pool-controller/dose-script.yaml
    vars:
      chemical: acid
      pump_id: muratic_acid

esp32:
  board: esp32dev
  framework:
    type: esp-idf

api:
  actions:
    - action: get_orp_calibration
      then:
        - lambda: |-
            id(orp_ezo).get_calibration();
    - action: set_orp_calibration
      # variables:
      # solution_mv: int
      then:
        - lambda: |-
            id(orp_ezo).set_calibration_generic(222);
    - action: get_ph_calibration
      then:
        - lambda: |-
            id(ph_ezo).get_calibration();
    - action: set_ph_calibration_mid
      # Optional `temperature` (°C of the buffer) overrides the probe's temp
      # compensation just before this point; omit or pass 0 to leave it as-is.
      variables:
        ph: float
        temperature: float
      then:
        - lambda: |-
            if (temperature > 0)
              id(ph_ezo).set_t(temperature);
            id(ph_ezo).set_calibration_point_mid(ph);
    - action: set_ph_calibration_low
      variables:
        ph: float
        temperature: float
      then:
        - lambda: |-
            if (temperature > 0)
              id(ph_ezo).set_t(temperature);
            id(ph_ezo).set_calibration_point_low(ph);
    - action: set_ph_calibration_high
      variables:
        ph: float
        temperature: float
      then:
        - lambda: |-
            if (temperature > 0)
              id(ph_ezo).set_t(temperature);
            id(ph_ezo).set_calibration_point_high(ph);
    - action: set_ph_temperature_compensation
      # Sends the EZO "T,n" command so calibration / readings are temperature
      # compensated. Call this with the buffer solution's temperature right
      # before a calibration point (queues ahead of the Cal command).
      variables:
        temperature: float
      then:
        - lambda: |-
            id(ph_ezo).set_t(temperature);
    - action: calibrate_chlorine_pump
      variables:
        rotations: float
      then:
        - logger.log:
            format: "Starting chlorine pump calibration with %d rotations"
            args: ["rotations"]
        - stepper.set_target:
            id: chlorinator
            target: !lambda "return id(chlorinator).current_position + (rotations * 200);"
        - while:
            condition:
              lambda: |-
                return id(chlorinator).current_position != id(chlorinator).target_position;
            then:
              - delay: 100ms
        - logger.log: "Chlorine pump calibration complete"
    - action: calibrate_acid_pump
      variables:
        rotations: float
      then:
        - logger.log:
            format: "Starting acid pump calibration with %d rotations"
            args: ["rotations"]
        - stepper.set_target:
            id: muratic_acid
            target: !lambda "return id(muratic_acid).current_position + (rotations * 200);"
        - while:
            condition:
              lambda: |-
                return id(muratic_acid).current_position != id(muratic_acid).target_position;
            then:
              - delay: 100ms
        - logger.log: "Acid pump calibration complete"
    - action: dose_chlorine
      variables:
        dose_ml: float
      then:
        - script.execute:
            id: dose_chlorine
            dose_ml: !lambda "return dose_ml;"
    - action: dose_acid
      variables:
        dose_ml: float
      then:
        - script.execute:
            id: dose_acid
            dose_ml: !lambda "return dose_ml;"

mapping:
  - id: pump_stepper_map
    from: string
    to: stepper::Stepper
    entries:
      chlorinator: chlorinator
      muratic_acid: muratic_acid
  - id: pump_chemical_map
    from: string
    to: string
    entries:
      chlorinator: chlorine
      muratic_acid: acid

esphome:
  on_boot:
    - tmc2209.configure:
        id: chlorinator
        microsteps: 1
        interpolation: false
        direction: ccw
        tcool_threshold: 600
    - tmc2209.currents:
        id: chlorinator
        standstill_mode: freewheeling
        # irun: 16
        run_current: 1250mA
        ihold: 0
        tpowerdown: 0
        iholddelay: 0
    - tmc2209.stallguard:
        id: chlorinator
        threshold: 50
    - tmc2209.configure:
        id: muratic_acid
        microsteps: 1
        interpolation: false
        direction: ccw
    - tmc2209.currents:
        id: muratic_acid
        standstill_mode: freewheeling
        irun: 16

uart:
  tx_pin: 17
  rx_pin: 16
  baud_rate: 500000

i2c:
  sda: 21
  scl: 22
  scan: false
  id: bus_a

wifi:
  power_save_mode: none
  reboot_timeout: 1h

logger:
  level: DEBUG

external_components:
  - source: github://slimcdk/esphome-custom-components
    components: [tmc2209_hub, tmc2209, stepper]

.chlorinator_pins: &ChlorinatorPins
  index_pin: 27
  enn_pin: 14
  diag_pin: 26

.muratic_pins: &MuraticPins
  index_pin: 33
  enn_pin: 13
  diag_pin: 32

globals:
  - id: pump_start_time
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: chlorine_pump_calibration
    type: unsigned long
    restore_value: no
    initial_value: "220"
  - id: acid_pump_calibration
    type: unsigned long
    restore_value: no
    initial_value: "565"

tmc2209_hub:

event:
  - platform: template
    id: events
    event_types:
      - "motor_stall"

stepper:
  - platform: tmc2209
    id: chlorinator
    max_speed: 700 steps/s
    acceleration: 2500 steps/s^2
    rsense: 110 mOhm
    address: 0x00
    config_dump_include_registers: true
    on_status:
      - logger.log:
          format: "Chlorine driver is reporting an update! (code %d)"
          args: ["code"]
    on_stall:
      - logger.log:
          format: "Motor stalled!"
          level: ERROR
      - event.trigger:
          id: events
          event_type: "motor_stall"
      - stepper.stop: chlorinator
    <<: *ChlorinatorPins
  - platform: tmc2209
    id: muratic_acid
    max_speed: 750 steps/s
    acceleration: 2500 steps/s^2
    rsense: 110 mOhm
    config_dump_include_registers: true
    address: 0x01
    on_status:
      - logger.log:
          format: "Acid driver is reporting an update! (code %d)"
          args: ["code"]
    <<: *MuraticPins

number:
  - platform: template
    name: "Chlorine Dose Amount (mL)"
    id: chlorine_dose_amount
    optimistic: true
    min_value: 1
    max_value: 2000
    step: 1
  - platform: template
    name: "Acid Dose Amount (mL)"
    id: acid_dose_amount
    optimistic: true
    min_value: 1
    max_value: 2000
    step: 1

  - platform: template
    name: Chlorine Stallguard threshold
    update_interval: 1s
    min_value: 0
    max_value: 255
    step: 5
    lambda: return id(chlorinator)->read_register(SGTHRS);
    set_action:
      - lambda: id(chlorinator)->write_register(SGTHRS, x);

  # - platform: template
  #   name: Chlorine Stallguard Threshold
  #   min_value: 0
  #   max_value: 255
  #   step: 1
  #   initial_value: "50"
  #   optimistic: true
  #   set_action:
  #     - tmc2209.stallguard:
  #         id: chlorinator
  #         threshold: !lambda "return x;"

# Button to run the calibration test
button:
  - platform: template
    name: "Run Custom Chlorine Dose"
    on_press:
      then:
        - if:
            condition:
              lambda: "return id(pump).state;"
            then:
              - logger.log: "Dosing Chlorine..."
              # - stepper.report_position:
              #     id: chlorinator
              #     position: 0
              - stepper.set_target:
                  id: chlorinator
                  target: !lambda "return id(chlorinator).current_position + (int(id(chlorine_dose_amount).state) * id(chlorine_pump_calibration));"
              - while:
                  condition:
                    lambda: |-
                      return id(chlorinator).current_position != id(chlorinator).target_position;
                  then:
                    - logger.log:
                        format: "chlorinator position : %d"
                        args: ["id(chlorinator).current_position"]
                    - delay: 1s
              - logger.log: "Chlorine dosing done!"
            else:
              - logger.log: "Cannot dose chlorine - pool pump must be running"
  - platform: template
    name: "Run Custom Acid Dose"
    on_press:
      then:
        - if:
            condition:
              lambda: "return id(pump).state;"
            then:
              - logger.log: "Dosing Acid..."
              # - stepper.report_position:
              #     id: muratic_acid
              #     position: 0
              - stepper.set_target:
                  id: muratic_acid
                  target: !lambda "return id(muratic_acid).current_position + (int(id(acid_dose_amount).state) * id(acid_pump_calibration));"
              - while:
                  condition:
                    lambda: |-
                      return id(muratic_acid).current_position != id(muratic_acid).target_position;
                  then:
                    - logger.log:
                        format: "muratic acid position! (code %d)"
                        args: ["id(muratic_acid).current_position"]
                    - delay: 5s
              - logger.log: "Acid dosing done!"
            else:
              - logger.log: "Cannot dose acid - pool pump must be running"

sensor:
  - platform: adc
    id: raw_ntc
    pin: 34
  - platform: resistance
    id: ntc_resistance
    sensor: raw_ntc
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: NTC Resistance
  - platform: ntc
    sensor: ntc_resistance
    calibration:
      - 1667.7Ohm -> 29.4°C
      - 2119.6Ohm -> 20°C
      - 2626.9Ohm -> 10°C
    name: Pool Water Temperature
    icon: mdi:coolant-temperature

    # update_interval: never

  - platform: ezo
    id: orp_ezo
    name: "ORP"
    icon: mdi:react
    address: 98
    unit_of_measurement: "mV"
    accuracy_decimals: 1
    update_interval: 30s
    state_class: "measurement"
    device_class: voltage
    on_calibration:
      then:
        - logger.log:
            format: "ORP sensor calibration updated: (code %s)"
            args: ["x.c_str()"]

  - platform: copy
    source_id: orp_ezo
    id: orp_avg
    icon: mdi:react
    name: "ORP Average"
    state_class: "measurement"
    device_class: voltage
    unit_of_measurement: mV
    accuracy_decimals: 1
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
          send_first_at: 1

  - platform: ezo
    id: ph_ezo
    name: "pH"
    icon: mdi:ph
    address: 99
    accuracy_decimals: 2
    update_interval: 30s
    state_class: "measurement"
    device_class: pH
    unit_of_measurement: pH
    on_calibration:
      then:
        - logger.log:
            format: "pH sensor calibration updated: (code %s)"
            args: ["x.c_str()"]

  - platform: copy
    source_id: ph_ezo
    id: ph_avg
    icon: mdi:ph
    name: "pH Average"
    state_class: "measurement"
    device_class: pH
    unit_of_measurement: pH
    accuracy_decimals: 2
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
          send_first_at: 1

  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 60s

  - platform: uptime
    type: seconds
    name: Uptime Sensor

  - platform: template
    name: "Total Chlorine Dosed"
    id: total_chlorine_dosed
    unit_of_measurement: "mL"
    device_class: volume
    state_class: total_increasing
    accuracy_decimals: 2
    lambda: |-
      static float clorine_dosed = 0.0;

      auto value = id(chlorinator).current_position / id(chlorine_pump_calibration);
      if (value > clorine_dosed) {
        clorine_dosed = value;
        return clorine_dosed;
      }
      return {};
    update_interval: 1s

  - platform: template
    name: "Total Acid Dosed"
    id: total_acid_dosed
    unit_of_measurement: "mL"
    device_class: volume
    state_class: total_increasing
    accuracy_decimals: 2
    lambda: |-
      static float acid_dosed = 0.0;

      auto value = id(muratic_acid).current_position / id(acid_pump_calibration);
      if (value > acid_dosed) {
        acid_dosed = value;
        return acid_dosed;
      }
      return {};
    update_interval: 1s
  - platform: tmc2209
    tmc2209_id: chlorinator
    type: motor_load
    name: chlorine load
    update_interval: 250ms
  - platform: tmc2209
    tmc2209_id: chlorinator
    type: stallguard_result
    name: Driver stallguard
    update_interval: 250ms
  # - platform: tmc2209
  #   tmc2209_id: muratic_acid
  #   type: actual_current
  #   name: Acid Actual current
  #   update_interval: 250ms

switch:
  - platform: gpio
    id: pump
    name: Pool Pump
    pin:
      number: 4
      inverted: False
    icon: mdi:water-pump
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - globals.set:
          id: pump_start_time
          value: !lambda "return millis();"
    on_turn_off:
      - switch.turn_off: booster_pump
      - globals.set:
          id: pump_start_time
          value: "0"
      - stepper.stop: chlorinator
      - stepper.stop: muratic_acid
  - platform: gpio
    id: booster_pump
    name: Pool Cleaner
    pin:
      number: 18
      inverted: False
    icon: mdi:water-pump
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: |-
              return id(pump).state && (millis() - id(pump_start_time) >= 300000);
          then:
            - logger.log: "Booster pump allowed to start - pool pump has been running for 5+ minutes"
          else:
            - logger.log: "Booster pump blocked - pool pump must run for 5 minutes first"
            - switch.turn_off: booster_pump
