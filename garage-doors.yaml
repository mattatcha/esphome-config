    name: "Left Opening duration"
  - platform: ratgdo
    ratgdo_id: door_left
    id: door_left_closing_duration
    type: closing_duration
    entity_category: config
    name: "Left Closing duration"
  - platform: ratgdo
    ratgdo_id: door_right
    id: door_right_opening_duration
